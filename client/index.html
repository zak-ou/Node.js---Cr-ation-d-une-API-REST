<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Posts - API REST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            background: white;
            border-radius: 5px;
            padding: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #666;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 15px;
            width: 100%;
        }

        button:hover {
            background: #555;
        }

        button:active {
            background: #222;
        }

        .posts-container {
            display: grid;
            gap: 15px;
        }

        .post-card {
            background: #fafafa;
            border-radius: 3px;
            padding: 20px;
            border: 1px solid #ddd;
            border-left: 3px solid #333;
        }

        .post-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .post-card p {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .post-actions {
            display: flex;
            gap: 10px;
        }

        .btn-edit, .btn-delete {
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            border: none;
            flex: 1;
        }

        .btn-edit {
            background: #28a745;
            color: white;
        }

        .btn-edit:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .message {
            padding: 15px;
            border-radius: 3px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 1em;
        }

        @media (max-width: 768px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestion des Posts - API REST</h1>
        
        <div id="message" class="message"></div>

        <div class="content-wrapper">
            <!-- Formulaire de création/modification -->
            <div class="panel">
                <h2 id="formTitle">Créer un nouveau post</h2>
                <form id="postForm">
                    <input type="hidden" id="postId">
                    
                    <div class="form-group">
                        <label for="userId">User ID</label>
                        <input type="number" id="userId" required min="1" value="1">
                    </div>

                    <div class="form-group">
                        <label for="title">Titre</label>
                        <input type="text" id="title" required placeholder="Titre du post">
                    </div>

                    <div class="form-group">
                        <label for="body">Contenu</label>
                        <textarea id="body" required placeholder="Contenu du post"></textarea>
                    </div>

                    <button type="submit" id="submitBtn">Créer le post</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()" style="display: none; margin-top: 10px; background: #6c757d;">Annuler</button>
                </form>
            </div>

            <!-- Liste des posts -->
            <div class="panel">
                <h2>Liste des posts</h2>
                <div id="postsContainer" class="posts-container">
                    <div class="loading">Chargement des posts...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/posts';
        let isEditMode = false;

        // Charger les posts au démarrage
        document.addEventListener('DOMContentLoaded', () => {
            loadPosts();
        });

        // Gérer la soumission du formulaire
        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const postData = {
                userId: parseInt(document.getElementById('userId').value),
                title: document.getElementById('title').value,
                body: document.getElementById('body').value
            };

            if (isEditMode) {
                const postId = document.getElementById('postId').value;
                await updatePost(postId, postData);
            } else {
                await createPost(postData);
            }
        });

        // Charger tous les posts
        async function loadPosts() {
            try {
                const response = await fetch(API_URL);
                const posts = await response.json();
                
                displayPosts(posts);
            } catch (error) {
                showMessage('Erreur lors du chargement des posts', 'error');
                console.error('Erreur:', error);
            }
        }

        // Afficher les posts
        function displayPosts(posts) {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999;">Aucun post disponible</p>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="post-meta">
                        <span>ID: ${post.id}</span>
                        <span>User: ${post.userId}</span>
                    </div>
                    <h3>${post.title}</h3>
                    <p>${post.body}</p>
                    <div class="post-actions">
                        <button class="btn-edit" onclick="editPost(${post.id})">Modifier</button>
                        <button class="btn-delete" onclick="deletePost(${post.id})">Supprimer</button>
                    </div>
                </div>
            `).join('');
        }

        // Créer un post
        async function createPost(postData) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(postData)
                });

                if (response.ok) {
                    showMessage('Post créé avec succès!', 'success');
                    resetForm();
                    loadPosts();
                } else {
                    showMessage('Erreur lors de la création du post', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
                console.error('Erreur:', error);
            }
        }

        // Modifier un post
        async function editPost(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const post = await response.json();

                // Remplir le formulaire
                document.getElementById('postId').value = post.id;
                document.getElementById('userId').value = post.userId;
                document.getElementById('title').value = post.title;
                document.getElementById('body').value = post.body;

                // Changer le mode
                isEditMode = true;
                document.getElementById('formTitle').textContent = 'Modifier le post';
                document.getElementById('submitBtn').textContent = 'Mettre à jour';
                document.getElementById('cancelBtn').style.display = 'block';

                // Scroll vers le formulaire
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                showMessage('Erreur lors du chargement du post', 'error');
                console.error('Erreur:', error);
            }
        }

        // Mettre à jour un post
        async function updatePost(id, postData) {
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(postData)
                });

                if (response.ok) {
                    showMessage('Post mis à jour avec succès!', 'success');
                    resetForm();
                    loadPosts();
                } else {
                    showMessage('Erreur lors de la mise à jour du post', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
                console.error('Erreur:', error);
            }
        }

        // Supprimer un post
        async function deletePost(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer ce post ?')) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Post supprimé avec succès!', 'success');
                    loadPosts();
                } else {
                    showMessage('Erreur lors de la suppression du post', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
                console.error('Erreur:', error);
            }
        }

        // Réinitialiser le formulaire
        function resetForm() {
            document.getElementById('postForm').reset();
            document.getElementById('postId').value = '';
            isEditMode = false;
            document.getElementById('formTitle').textContent = 'Créer un nouveau post';
            document.getElementById('submitBtn').textContent = 'Créer le post';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Afficher un message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
